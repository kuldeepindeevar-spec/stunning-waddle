<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --bg: #000000;
  --surface: #0e0f11;
  --raised: #16181c;
  --pressed: #1e2126;
  --divider: #22252b;
  --divider-strong: #2e3238;

  --text: #f2f4f7;
  --text-2: #9aa2ad;
  --text-3: #6b727d;

  --accent: #d81222;
  --info: #3d8bfd;
  --gain: #00c26e;
  --loss: #ff4d4f;

  --grid: #1b1e23;

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;                 /* the scroller below owns scrolling */
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}

/* Chrome is not selectable; figures are, so a number can be copied out. */
body { -webkit-user-select: none; user-select: none; }
.sel, .figure, td, .stat-v { -webkit-user-select: text; user-select: text; }

#app { display: flex; flex-direction: column; height: 100%; }

/* ------------------------------------------------------------- top chrome */
#topbar {
  padding: calc(var(--safe-top) + 8px) 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg);
  flex: none;
}
#acct { min-width: 0; }
#acct .id { font-size: 15px; font-weight: 700; letter-spacing: -0.2px; }
#acct .id::after { content: " \25BE"; color: var(--text-2); font-size: 10px; }
#acct .sub {
  font-size: 10px; color: var(--text-3); letter-spacing: 0.6px;
  margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#topicons { display: flex; gap: 16px; color: var(--text-2); flex: none; }
#topicons svg { width: 19px; height: 19px; display: block; }

#strip {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 16px;
  background: var(--surface);
  border-top: 0.5px solid var(--divider);
  border-bottom: 0.5px solid var(--divider);
  flex: none;
}
.pill {
  font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  border: 0.5px solid currentColor; border-radius: 3px; padding: 2px 5px;
}
.pill.live { color: var(--gain); }
.pill.snap { color: var(--accent); }
#strip .msg { font-size: 10px; color: var(--text-2); flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#strip .clock { font-family: var(--mono); font-size: 10px; color: var(--text-3); }

/* --------------------------------------------------------------- scroller */
#scroller {
  flex: 1; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;    /* no rubber-band into Safari's UI */
}
#pull {
  height: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase;
  transition: height 0.18s ease;
}
#pull.armed { color: var(--info); }
#sheet { padding-bottom: 28px; }

/* ------------------------------------------------------------------ atoms */
.hr { height: 0.5px; background: var(--divider); }
.hr.inset { margin-left: 16px; }

.section {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 16px 8px;
}
.section h2 {
  margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 1.1px;
  text-transform: uppercase; color: var(--text-3);
}
.section .aside { font-family: var(--mono); font-size: 10px; color: var(--text-3); }

.mono { font-family: var(--mono); }
.up { color: var(--gain); }
.down { color: var(--loss); }
.flat { color: var(--text-2); }

/* ------------------------------------------------------------------- hero */
#hero { padding: 16px 16px 8px; }
#hero .label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
  text-transform: uppercase; color: var(--text-3);
}
#hero .nlv {
  font-family: var(--mono); font-size: 38px; font-weight: 300;

}
#hero .day { margin-top: 4px; display: flex; gap: 8px; align-items: baseline; }
#hero .day span { font-family: var(--mono); font-size: 14px; font-weight: 600; }
#hero .day .cap { font-family: var(--sans); font-size: 11px; color: var(--text-3); font-weight: 400; }

#banner {
  margin: 12px 16px 0; padding: 12px;
  background: var(--raised); border-radius: 4px;
  border-left: 2px solid var(--gain);
  display: flex; align-items: center; gap: 12px;
}
#banner .main { flex: 1; min-width: 0; }
#banner .cap {

}
#banner .ret {

}
#banner .side { text-align: right; flex: none; }
#banner .mult { font-family: var(--mono); font-size: 20px; font-weight: 600; }
#banner .cagr { font-size: 10px; color: var(--text-3); margin-top: 3px; }

/* ------------------------------------------------------------------ chart */
#chartwrap { position: relative; margin-top: 8px; }
#chartwrap svg { display: block; width: 100%; }
#chartwrap .badge {
  position: absolute; top: 0; left: 4px;
  font-size: 8px; font-weight: 700; letter-spacing: 0.4px;
  color: var(--text-3); text-transform: uppercase;
}
#chartwrap .ax {
  position: absolute; font-family: var(--mono); font-size: 9px; color: var(--text-3);
}
.chartfoot {
  padding: 4px 16px 0; font-family: var(--mono); font-size: 9px; color: var(--text-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* -------------------------------------------------------------- stat grid */
.grid { display: flex; padding: 8px 16px; gap: 16px; }
.grid .cell { flex: 1; min-width: 0; }
.grid .cell.r { text-align: right; }
.stat-l {

  text-transform: uppercase; color: var(--text-3); margin-bottom: 3px;
}
.stat-v { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.note { padding: 8px 16px 0; font-size: 10px; line-height: 15px; color: var(--text-3); }

/* ------------------------------------------------------------- allocation */
#allocbar { display: flex; height: 10px; border-radius: 2px; overflow: hidden; gap: 1px; margin: 8px 16px 0; }
#alloclegend {

#alloclegend .li { display: flex; align-items: center; gap: 4px; width: calc(33.333% - 6px); }
#alloclegend .sw { width: 7px; height: 7px; border-radius: 1px; flex: none; }
#alloclegend .sy { font-size: 10px; font-weight: 700; letter-spacing: 0.4px; color: var(--text-2); flex: 1; }
#alloclegend .wt { font-family: var(--mono); font-size: 10px; color: var(--text-3); }

.theme-row { display: flex; align-items: center; padding: 8px 16px; gap: 8px; }
.theme-row .n { flex: 1; font-size: 12px; color: var(--text-2); }
.theme-row .w { font-family: var(--mono); font-size: 12px; width: 56px; text-align: right; }
.theme-row .v { font-family: var(--mono); font-size: 12px; color: var(--text-2); width: 96px; text-align: right; }

/* ---------------------------------------------------------------- blotter */
.cols { display: flex; padding: 0 16px 4px; }

.row { display: flex; align-items: center; padding: 9px 16px; gap: 8px; }

.row .qc { flex: 1.9; text-align: right; }

.row .nm {

.row .qty { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-top: 2px; }
.row .last { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.row .dpct { font-family: var(--mono); font-size: 11px; margin-top: 3px; }
.row .mv { font-family: var(--mono); font-size: 14px; font-weight: 600; }
.row .pnl { font-family: var(--mono); font-size: 11px; margin-top: 3px; }
.row .pnlp { font-family: var(--mono); font-size: 10px; margin-top: 1px; }

.cashrow { display: flex; justify-content: space-between; padding: 12px 16px; }
.cashrow .l { font-size: 13px; color: var(--text-2); }
.cashrow .v { font-family: var(--mono); font-size: 13px; }
.totalrow {

.totalrow .l { font-size: 14px; font-weight: 700; }

.act .ca { font-family: var(--mono); font-size: 11px; color: var(--text-2); margin-top: 1px; }

#verdict {

#verdict .t { font-size: 16px; font-weight: 700; }

.deriv .dl { font-size: 12px; color: var(--text-2); }

#meter .mark { position: absolute; width: 2px; height: 16px; background: var(--text); margin-left: -1px; }

.chk { display: flex; gap: 8px; padding: 10px 16px; }

.facts .fv { font-family: var(--mono); font-size: 14px; margin-top: 2px; }

#back { display: flex; align-items: center; gap: 2px; padding: 8px 12px; color: var(--info); font-size: 14px; }

.dhead { padding: 0 16px 12px; }

.dhead .dl { font-family: var(--mono); font-size: 12px; margin-top: 2px; }
.drow { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; gap: 12px; }
.drow .l { font-size: 13px; color: var(--text-2); }
.drow .v { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.proof { padding: 12px 16px; font-family: var(--mono); font-size: 11px;

/* --------------------------------------------------------------- settings */
.setrow { padding: 12px 16px; }
.setrow label { font-size: 10px; font-weight: 700; letter-spacing: 0.4px;

.setrow input {
  width: 100%; background: var(--raised); border: 0.5px solid var(--divider-strong);

  padding: 10px; outline: none; -webkit-appearance: none;
}
.setrow input:focus { border-color: var(--info); }
.btnrow { display: flex; gap: 8px; padding: 0 16px 12px; }
.btn {

}
.btn:active { background: var(--pressed); }
.btn.primary { background: var(--info); border-color: var(--info); color: #fff; }

/* ---------------------------------------------------------------- tab bar */
#tabs {
  display: flex; flex: none;
  background: var(--surface);
  border-top: 0.5px solid var(--divider-strong);
  padding: 8px 0 calc(var(--safe-bottom) + 8px);
}
#tabs .tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  min-height: 44px;                  /* Apple's minimum tap target */
  color: var(--text-3); position: relative;
}
#tabs .tab.on { color: var(--text); }
#tabs .tab.on::before {
  content: ""; position: absolute; top: -8px; width: 30px; height: 2px; background: var(--accent);
}
#tabs svg { width: 19px; height: 19px; display: block; }
#tabs .lab { font-size: 9px; font-weight: 700; letter-spacing: 0.4px; }

/* ==========================================================================
   2. ENGINE — replay the ledger, value it, state the invariants.
   Ported line for line from the React Native build so both produce the same
   numbers from the same rows.
   ========================================================================== */

/** Replay every trade in date order. Average-cost basis, as a US broker reports. */
function replayLedger(trades) {
  const ordered = trades.slice().sort((a, b) =>
    a.date === b.date ? a.id.localeCompare(b.id) : a.date.localeCompare(b.date));

  const bySymbol = new Map();
  let cash = INITIAL_CAPITAL, minimumCash = cash, realizedPnl = 0;

  for (const t of ordered) {
    const gross = t.qty * t.px;
    let lot = bySymbol.get(t.sym);
    if (!lot) {
      lot = { sym: t.sym, qty: 0, cost: 0, avg: 0, realized: 0,
              firstBuy: t.date, lastTrade: t.date, trades: 0 };
      bySymbol.set(t.sym, lot);
    }

    if (t.side === "BUY") {
      lot.qty += t.qty;
      lot.cost += gross;
      cash -= gross;
    } else {
      if (t.qty > lot.qty) throw new Error(t.id + ": sells more " + t.sym + " than held");
      const basisOut = lot.avg * t.qty;      // sold shares carry the blended basis
      const gain = gross - basisOut;
      lot.qty -= t.qty;
      lot.cost -= basisOut;
      lot.realized += gain;
      realizedPnl += gain;
      cash += gross;
    }

    lot.avg = lot.qty > 0 ? lot.cost / lot.qty : 0;
    lot.lastTrade = t.date;
    lot.trades += 1;
    if (cash < minimumCash) minimumCash = cash;
  }

  return { lots: Array.from(bySymbol.values()), cash, realizedPnl, minimumCash };
}

/** Value the replayed ledger against a quote map. */
function buildPortfolio(quotes, staleSet, asOf) {
  const { lots, cash, realizedPnl } = replayLedger(TRADES);
  const open = lots.filter(l => l.qty > 0);

  const positions = open.map(lot => {
    const q = quotes[lot.sym];
    if (!q) throw new Error("no quote for " + lot.sym);
    const marketValue = lot.qty * q.price;
    const unrealized = marketValue - lot.cost;
    const dayChange = q.price - q.prev;
    return Object.assign({}, lot, {
      price: q.price,
      prev: q.prev,
      marketValue,
      unrealized,
      unrealizedPct: lot.cost > 0 ? (unrealized / lot.cost) * 100 : 0,
      dayPnl: dayChange * lot.qty,
      dayChange,
      dayChangePct: q.prev > 0 ? (dayChange / q.prev) * 100 : 0,
      weight: 0,
      stale: staleSet ? staleSet.has(lot.sym) : false
    });
  });

  const securities = positions.reduce((s, p) => s + p.marketValue, 0);
  const netLiquidation = securities + cash;

  // Weights are a share of NLV, so cash is in the denominator and the position
  // weights deliberately sum to slightly under 100%.
  for (const p of positions) p.weight = netLiquidation > 0 ? p.marketValue / netLiquidation : 0;
  positions.sort((a, b) => b.marketValue - a.marketValue);

  const openCost = positions.reduce((s, p) => s + p.cost, 0);
  const unrealizedPnl = securities - openCost;
  const totalPnl = netLiquidation - INITIAL_CAPITAL;
  const dayPnl = positions.reduce((s, p) => s + p.dayPnl, 0);
  const prevNlv = netLiquidation - dayPnl;

  const now = asOf || new Date();
  const years = (now.getTime() - Date.parse(INCEPTION_DATE + "T00:00:00Z")) /
                (365.25 * 24 * 3600 * 1000);
  const growth = netLiquidation / INITIAL_CAPITAL;

  return {
    positions,
    summary: {
      initialCapital: INITIAL_CAPITAL,
      netLiquidation, securities, cash, openCost,
      unrealizedPnl, realizedPnl, totalPnl,
      totalReturnPct: (totalPnl / INITIAL_CAPITAL) * 100,
      dayPnl,
      dayPnlPct: prevNlv > 0 ? (dayPnl / prevNlv) * 100 : 0,
      years,
      cagrPct: years > 0 ? (Math.pow(growth, 1 / years) - 1) * 100 : 0,
      growth,
      winners: positions.filter(p => p.unrealized > 0).length,
      losers: positions.filter(p => p.unrealized < 0).length
    }
  };
}

const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

/** The accounting identities the whole app rests on. */
function checkInvariants(pf) {
  const { positions: ps, summary: s } = pf;
  const replay = replayLedger(TRADES);
  const sum = fn => ps.reduce((t, p) => t + fn(p), 0);
  const mk = (name, detail, expected, actual, tol) => ({
    name, detail, expected, actual,
    passed: Math.abs(expected - actual) <= (tol === undefined ? 0.01 : tol)
  });

  return [
    mk("Sources and uses",
       "Open cost basis + settled cash must equal the opening deposit plus realised P&L. Nothing enters or leaves the account except the original $100,000.",
       INITIAL_CAPITAL + s.realizedPnl, s.openCost + s.cash),
    mk("Net liquidation value",
       "NLV must equal the sum of position market values plus settled cash.",
       sum(p => p.marketValue) + s.cash, s.netLiquidation),
    mk("Position market value",
       "Every line must satisfy quantity x last price = market value.",
       sum(p => p.qty * p.price), sum(p => p.marketValue)),
    mk("Unrealised P&L",
       "Unrealised P&L must equal market value less remaining cost basis.",
       sum(p => p.marketValue - p.cost), s.unrealizedPnl),
    mk("Total P&L decomposition",
       "Realised plus unrealised P&L must equal net liquidation value less the deposit.",
       s.realizedPnl + s.unrealizedPnl, s.totalPnl),
    mk("Total return",
       "Total return % must equal total P&L divided by the opening deposit.",
       (s.totalPnl / INITIAL_CAPITAL) * 100, s.totalReturnPct, 1e-9),
    mk("Weights",
       "Position weights plus the cash weight must sum to 100% of NLV.",
       1, sum(p => p.weight) + s.cash / s.netLiquidation, 1e-9),
    mk("Day P&L",
       "Day P&L must equal the sum of (last - previous close) x quantity.",
       sum(p => (p.price - p.prev) * p.qty), s.dayPnl),
    mk("Cash never negative",
       "The account is never overdrawn on any date in the ledger — no leverage is used.",
       0, Math.min(0, replay.minimumCash)),
    mk("Average cost",
       "Each line satisfies average cost x quantity = remaining cost basis.",
       sum(p => round2(p.avg * p.qty)), sum(p => round2(p.cost)), ps.length * 0.01)
  ];
}

/* --------------------------------------------------------- equity curve -- */

/** Shares held and settled cash as at the end of the given date. */
function holdingsAsOf(t) {
  const shares = {};
  let cash = INITIAL_CAPITAL;
  for (const tr of TRADES) {
    if (Date.parse(tr.date + "T00:00:00Z") > t) break;
    const gross = tr.qty * tr.px;
    if (tr.side === "BUY") { shares[tr.sym] = (shares[tr.sym] || 0) + tr.qty; cash -= gross; }
    else                   { shares[tr.sym] = (shares[tr.sym] || 0) - tr.qty; cash += gross; }
  }
  return { shares, cash };
}

/**
 * Month-end timestamps from inception to now, plus now itself. Walks
 * year/month as integers rather than mutating a Date — month arithmetic on a
 * date pinned to a month end normalises in ways that are easy to get wrong.
 */
function monthEnds(now) {
  const startMs = Date.parse(INCEPTION_DATE + "T00:00:00Z");
  const start = new Date(startMs);
  const out = [startMs];
  let y = start.getUTCFullYear(), m = start.getUTCMonth();
  for (let guard = 0; guard < 1200; guard++) {
    const end = Date.UTC(y, m + 1, 0);       // day 0 of next month = last of this
    if (end >= now) break;
    if (end > startMs) out.push(end);
    m += 1;
    if (m > 11) { m = 0; y += 1; }
  }
  out.push(now);
  return out;
}

/**
 * Modelled curve: each symbol's price path is interpolated in log space
 * between the prices the ledger actually transacted at and today's mark. The
 * endpoints are exact; the shape between them is an approximation, and the
 * chart labels itself as such.
 */
function buildModelledCurve(quotes, now) {
  const anchors = {};
  for (const t of TRADES) {
    (anchors[t.sym] = anchors[t.sym] || []).push({ t: Date.parse(t.date + "T00:00:00Z"), px: t.px });
  }
  for (const sym in anchors) {
    if (quotes[sym]) anchors[sym].push({ t: now, px: quotes[sym].price });
    anchors[sym].sort((a, b) => a.t - b.t);
  }

  const priceAt = (sym, t) => {
    const list = anchors[sym];
    if (!list || !list.length) return null;
    if (t <= list[0].t) return list[0].px;
    if (t >= list[list.length - 1].t) return list[list.length - 1].px;
    for (let i = 1; i < list.length; i++) {
      const a = list[i - 1], b = list[i];
      if (t <= b.t) {
        const span = b.t - a.t;
        const w = span === 0 ? 1 : (t - a.t) / span;
        return Math.exp(Math.log(a.px) * (1 - w) + Math.log(b.px) * w);
      }
    }
    return list[list.length - 1].px;
  };

  const points = [];
  for (const t of monthEnds(now)) {
    const { shares, cash } = holdingsAsOf(t);
    let value = cash;
    for (const sym in shares) {
      if (shares[sym] <= 0) continue;
      const px = priceAt(sym, t);
      if (px != null) value += shares[sym] * px;
    }
    points.push({ t, value });
  }
  return { points, basis: "modelled" };
}

/* ==========================================================================
   3. QUOTES

   Safari enforces CORS, and the Yahoo endpoint sends no CORS header, so the
   request has to go through a relay. A short chain is tried in order and the
   first that answers wins; the working one is remembered for next time. Any
   symbol nothing answers for keeps its snapshot mark and is flagged in the
   status strip — a stale price is never shown as a live one.

   Set your own relay under Audit > Data source to avoid the public ones.
   ========================================================================== */

const SYMBOLS = (() => {
  const held = new Map();
  for (const t of TRADES) held.set(t.sym, (held.get(t.sym) || 0) + (t.side === "BUY" ? t.qty : -t.qty));
  return Array.from(held.entries()).filter(e => e[1] > 0).map(e => e[0]);
})();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const YAHOO = sym =>
  "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(sym) +
  "?range=1d&interval=1d";

/** Relays, in the order they are tried. A custom one always goes first. */
function relays() {
  const list = [];
  const custom = store.get("aiap.relay", "").trim();
  if (custom) {
    list.push(u => custom.indexOf("{url}") >= 0
      ? custom.replace("{url}", encodeURIComponent(u))
      : custom + encodeURIComponent(u));
  }
  list.push(u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u));
  list.push(u => "https://corsproxy.io/?url=" + encodeURIComponent(u));
  list.push(u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u));
  list.push(u => u);                       // direct, for a same-origin relay
  return list;
}

let workingRelay = parseInt(store.get("aiap.relayIndex", "-1"), 10);

function fetchJson(url, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms || 9000);
  return fetch(url, { signal: ctl.signal, cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .finally(() => clearTimeout(timer));
}

function parseChart(body) {
  const meta = body && body.chart && body.chart.result && body.chart.result[0] &&
               body.chart.result[0].meta;
  const price = meta && meta.regularMarketPrice;
  if (typeof price !== "number" || !isFinite(price) || price <= 0) return null;
  const prev = typeof meta.previousClose === "number" ? meta.previousClose
             : typeof meta.chartPreviousClose === "number" ? meta.chartPreviousClose
             : price;
  return { price, prev };
}

/** One symbol, trying relays in order. Resolves to null rather than throwing. */
async function fetchQuote(sym) {
  const list = relays();
  const order = [];
  if (workingRelay >= 0 && workingRelay < list.length) order.push(workingRelay);
  for (let i = 0; i < list.length; i++) if (i !== workingRelay) order.push(i);

  for (const i of order) {
    try {
      const q = parseChart(await fetchJson(list[i](YAHOO(sym))));
      if (q) {
        if (workingRelay !== i) { workingRelay = i; store.set("aiap.relayIndex", String(i)); }
        return q;
      }
    } catch (e) { /* try the next relay */ }
  }
  return null;
}

async function fetchQuotes() {
  const quotes = {}, stale = new Set();
  const results = await Promise.all(SYMBOLS.map(async s => [s, await fetchQuote(s)]));
  for (const [sym, q] of results) {
    if (q) quotes[sym] = q;
    else { quotes[sym] = Object.assign({}, SNAPSHOT[sym]); stale.add(sym); }
  }
  return { quotes, stale, live: stale.size === 0 };
}

function snapshotQuotes() {
  const quotes = {}, stale = new Set();
  for (const s of SYMBOLS) { quotes[s] = Object.assign({}, SNAPSHOT[s]); stale.add(s); }
  return { quotes, stale, live: false };
}

/* ------------------------------------------------------------------ chart */
function chartHtml(curve) {
  const pts = curve.points;
  if (pts.length < 2) return "";

  const W = Math.max(document.documentElement.clientWidth, 320);
  const H = 168, padL = 4, padR = 52, padT = 10, padB = 20;

  const xs = pts.map(p => p.t);
  const ys = pts.map(p => Math.log(Math.max(p.value, 1)));
  const xMin = Math.min.apply(null, xs), xMax = Math.max.apply(null, xs);
  const yMin = Math.min.apply(null, ys), yMax = Math.max.apply(null, ys);
  const ySpan = (yMax - yMin) || 1;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const sx = t => padL + ((t - xMin) / ((xMax - xMin) || 1)) * plotW;
  const sy = v => padT + plotH - ((Math.log(Math.max(v, 1)) - yMin) / ySpan) * plotH;

  const line = pts.map((p, i) => (i ? "L" : "M") + sx(p.t).toFixed(2) + "," + sy(p.value).toFixed(2)).join(" ");
  const area = line + " L" + sx(xMax).toFixed(2) + "," + (padT + plotH).toFixed(2) +
                      " L" + sx(xMin).toFixed(2) + "," + (padT + plotH).toFixed(2) + " Z";

  // Decade gridlines — a 20x move is unreadable on a linear axis.
  const decades = [];
  for (let e = 4; e <= 8; e++) {
    const v = Math.pow(10, e);
    if (Math.log(v) >= yMin && Math.log(v) <= yMax) decades.push(v);
  }
  const years = [];
  for (let y = new Date(xMin).getUTCFullYear() + 1; Date.UTC(y, 0, 1) < xMax; y++) years.push(Date.UTC(y, 0, 1));

  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" height="' + H + '">' +
    '<defs><linearGradient id="af" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="rgba(61,139,253,0.28)"/>' +
    '<stop offset="1" stop-color="rgba(61,139,253,0)"/></linearGradient></defs>';
  for (const v of decades)
    svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + sy(v) + '" y2="' + sy(v) +
           '" stroke="var(--grid)" stroke-width="1"/>';
  for (const t of years)
    svg += '<line x1="' + sx(t) + '" x2="' + sx(t) + '" y1="' + padT + '" y2="' + (padT + plotH) +
           '" stroke="var(--grid)" stroke-width="1"/>';
  svg += '<path d="' + area + '" fill="url(#af)"/>' +
         '<path d="' + line + '" fill="none" stroke="var(--info)" stroke-width="1.75" ' +
         'stroke-linejoin="round" stroke-linecap="round"/>' +
         '<circle cx="' + sx(pts[pts.length - 1].t) + '" cy="' + sy(pts[pts.length - 1].value) +
         '" r="3" fill="var(--info)"/></svg>';

  let labels = '<div class="badge">Log scale &middot; ' +
    (curve.basis === "marked" ? "marked monthly" : "indicative path") + "</div>";
  for (const v of decades)
    labels += '<div class="ax" style="top:' + (sy(v) - 6) + "px;right:8px\">" +
              (v >= 1e6 ? (v / 1e6) + "M" : (v / 1e3) + "K") + "</div>";
  for (const t of years)
    labels += '<div class="ax" style="left:' + (sx(t) - 16) + 'px;bottom:2px">' + axisDate(t) + "</div>";

  const first = pts[0], last = pts[pts.length - 1];
  return '<div id="chartwrap">' + svg + labels + "</div>" +
    '<div class="chartfoot">' + whole(first.value) + " &rarr; " + whole(last.value) + " &middot; " +
    (curve.basis === "marked" ? "month-end closes replayed against the ledger"
                              : "endpoints exact, path interpolated") + "</div>";
}

       whole(INITIAL_CAPITAL) + " USD deposit. No money added or withdrawn since. " +
       "Mandate band " + RETURN_BAND.min + "%&ndash;" + RETURN_BAND.max + "%.</div>";

  h += section("Allocation", ps.length + " positions");

  ps.forEach((p, i) => {
    h += '<div style="flex:' + Math.max(p.weight, 0.0008) + ";background:" + RAMP[i % RAMP.length] + '"></div>';
  });
  const cw = s.cash / s.netLiquidation;
  if (cw > 0) h += '<div style="flex:' + Math.max(cw, 0.0008) + ';background:var(--divider)"></div>';
  h += "</div>";
  h += '<div id="alloclegend">';
  ps.forEach((p, i) => {

  });
  h += "</div>";

  const themes = new Map();
  for (const p of ps) {

  Array.from(themes.entries()).sort((a, b) => b[1] - a[1]).forEach(([name, v]) => {
    h += '<div class="theme-row"><span class="n">' + esc(name) + "</span>" +
         '<span class="w">' + pct((v / s.netLiquidation) * 100, 1) + "</span>" +
         '<span class="v">' + money(v) + "</span></div>" + hr(true);
  });

  h += section("Positions", s.winners + " up · " + s.losers + " down");
  h += '<div class="cols"><span style="flex:3.1">Symbol / Position</span>' +
       '<span style="flex:1.9;text-align:right">Last</span>' +
       '<span style="flex:2.8;text-align:right">Value / Unreal P&amp;L</span></div>' + hr();

  for (const p of ps) {
    const dc = tone(p.dayChange), pc = tone(p.unrealized);
    const inst = INSTRUMENTS[p.sym] || { name: p.sym };
    h += '<div class="row" data-sym="' + p.sym + '">' +
      '<div class="idc"><div class="sym">' + p.sym +
      (p.stale && partialStale ? ' <span style="color:var(--accent)">&bull;</span>' : "") + "</div>" +
      '<div class="nm">' + esc(inst.name) + "</div>" +
      '<div class="qty">' + qty(p.qty) + " @ " + px(p.avg) + "</div></div>" +
      '<div class="qc"><div class="last ' + dc + '">' + px(p.price) + "</div>" +
      '<div class="dpct ' + dc + '">' + sPct(p.dayChangePct) + "</div></div>" +
      '<div class="vc"><div class="mv">' + money(p.marketValue) + "</div>" +
      '<div class="pnl ' + pc + '">' + sMoney(p.unrealized) + "</div>" +
      '<div class="pnlp ' + pc + '">' + sPct(p.unrealizedPct) + "</div></div></div>" + hr(true);
  }

  h += '<div class="cashrow"><span class="l">USD Cash</span>' +
       '<span class="v">' + money(s.cash) + "</span></div>" + hr();
  h += '<div class="totalrow"><span class="l">Total</span>' +
       '<span class="v">' + money(s.netLiquidation) + "</span></div>";

  return h;
}

/* --------------------------------------------------------------- activity */
function viewActivity() {
  const s = portfolio().summary;
  const buys = TRADES.filter(t => t.side === "BUY").length;

  const lines = [{
    key: "deposit", date: INCEPTION_DATE, side: "DEPOSIT", sym: "USD",
    detail: "Account funded", gross: INITIAL_CAPITAL, cashAfter: INITIAL_CAPITAL,
    note: "The only external cash movement in the account’s history."
  }];
  let cash = INITIAL_CAPITAL;
  for (const t of TRADES) {
    const gross = t.qty * t.px;
    cash += t.side === "BUY" ? -gross : gross;
    lines.push({
      key: t.id, date: t.date, side: t.side, sym: t.sym,
      detail: qty(t.qty) + " @ " + px(t.px),
      gross: t.side === "BUY" ? -gross : gross, cashAfter: cash, note: t.note
    });
  }
  lines.reverse();

  let h = section("Statement", buys + " buys · " + (TRADES.length - buys) + " sells");
  h += '<div class="box">' + TRADES.length + " fills since " + shortDate(INCEPTION_DATE) +
       ". Realised P&amp;L across all closed share lots is " +
       '<span class="' + tone(s.realizedPnl) + '">' + sMoney(s.realizedPnl) + "</span>" +
       ", which stayed in the account and funded later buys.</div>" + hr();

  for (const l of lines) {
    const col = l.side === "SELL" ? "var(--accent)" : l.side === "DEPOSIT" ? "var(--info)" : "var(--gain)";
    const inst = INSTRUMENTS[l.sym];
    h += '<div class="act"><div class="l">' +
      '<div class="top"><span class="side" style="color:' + col + '">' + l.side + "</span>" +
      '<span class="sym">' + l.sym + '</span><span class="dt">' + shortDate(l.date) + "</span></div>" +
      '<div class="det">' + esc(l.detail) + (inst ? " · " + esc(inst.name) : "") + "</div>" +
      '<div class="why">' + esc(l.note) + "</div></div>" +
      '<div class="r"><div class="gross ' + tone(l.gross) + '">' + sMoney(l.gross) + "</div>" +
      '<div class="cl">cash after</div><div class="ca">' + money(l.cashAfter) + "</div></div></div>" + hr(true);
  }
  return h;
}

/* ------------------------------------------------------------------ audit */
function viewAudit() {
  const pf = portfolio(), s = pf.summary, ps = pf.positions;
  const inv = checkInvariants(pf);
  const allPass = inv.every(i => i.passed);
  const inBand = s.totalReturnPct >= RETURN_BAND.min && s.totalReturnPct <= RETURN_BAND.max;

  const floor = INITIAL_CAPITAL * (1 + RETURN_BAND.min / 100);
  const ceil  = INITIAL_CAPITAL * (1 + RETURN_BAND.max / 100);
  const down  = ((floor - s.netLiquidation) / s.netLiquidation) * 100;
  const up    = ((ceil  - s.netLiquidation) / s.netLiquidation) * 100;

  const tick = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="var(--gain)" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-width="1.5"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>';
  const cross = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="var(--loss)" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-width="1.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';

  let h = '<div id="verdict" style="border-left-color:' + (allPass ? "var(--gain)" : "var(--loss)") + '">' +
    (allPass ? tick : cross).replace('class="ico"', 'style="width:22px;height:22px;flex:none"') +
    '<div><div class="t">' + (allPass ? "Reconciled" : "Reconciliation failed") + "</div>" +
    '<div class="b">' + inv.filter(i => i.passed).length + " of " + inv.length +
    " accounting identities hold against " + (state.feed.live ? "live" : "snapshot") + " marks.</div></div></div>";

  const dr = (l, v, cls, strong) =>
    '<div class="dr' + (strong ? " strong" : "") + '"><span class="dl">' + l +
    '</span><span class="dv ' + (cls || "") + '">' + v + "</span></div>";

  h += section("How the return is computed") + hr() + '<div class="deriv">' +
    dr("Opening deposit", money(INITIAL_CAPITAL)) +
    dr("Securities at last price", money(s.securities)) +
    dr("Settled cash", money(s.cash)) + hr() +
    dr("Net liquidation value", money(s.netLiquidation), "", true) +
    dr("less opening deposit", "(" + money(INITIAL_CAPITAL) + ")") + hr() +
    dr("Total P&amp;L", sMoney(s.totalPnl), tone(s.totalPnl), true) +
    dr("&divide; " + money(INITIAL_CAPITAL) + " deposit", sPct(s.totalReturnPct), tone(s.totalPnl), true) +
    "</div>";

  // Where the actual return sits inside the mandate band.
  const lo = RETURN_BAND.min - (RETURN_BAND.max - RETURN_BAND.min) * 0.35;
  const hi = RETURN_BAND.max + (RETURN_BAND.max - RETURN_BAND.min) * 0.35;
  const clamp = n => Math.max(0, Math.min(1, n));
  const posP = clamp((s.totalReturnPct - lo) / (hi - lo)) * 100;
  const b0 = clamp((RETURN_BAND.min - lo) / (hi - lo)) * 100;
  const b1 = clamp((RETURN_BAND.max - lo) / (hi - lo)) * 100;

  // Uses .deriv so the label/value rows get the same space-between layout as
  // the derivation above rather than collapsing together.
  h += section("Mandate band") + hr() + '<div class="deriv">' +
    '<div class="dr"><span class="dl">Target</span><span class="dv">' +
    RETURN_BAND.min + "% &ndash; " + RETURN_BAND.max + "%</span></div>" +
    '<div class="dr"><span class="dl">Actual</span><span class="dv ' + (inBand ? "up" : "down") + '">' +
    sPct(s.totalReturnPct) + "</span></div>" +
    '<div id="meter"><div class="track"></div>' +
    '<div class="band" style="left:' + b0 + "%;width:" + (b1 - b0) + '%"></div>' +
    '<div class="mark" style="left:' + posP + '%"></div></div>' +
    '<div class="note" style="padding:12px 0 0">Marks move with the market, so the band is a ' +
    "calibration and not a guarantee. From here the book can fall " + Math.abs(down).toFixed(1) +
    "% before it drops below " + RETURN_BAND.min + "%, or rise " + up.toFixed(1) +
    "% before it exceeds " + RETURN_BAND.max + "%.</div></div>";

  h += section("Accounting identities") + hr();
  for (const i of inv) {
    h += '<div class="chk">' + (i.passed ? tick : cross) +
      '<div><div class="n">' + esc(i.name) + "</div>" +
      '<div class="d">' + esc(i.detail) + "</div>" +
      '<div class="num">expected ' + i.expected.toFixed(4) + " · actual " + i.actual.toFixed(4) +
      " · delta " + Math.abs(i.expected - i.actual).toExponential(2) + "</div></div></div>" + hr(true);
  }

  h += section("Provenance") + hr();
  const fact = (l, v) => '<div class="f"><div class="fl">' + esc(l) + '</div><div class="fv">' + v + "</div></div>";
  h += '<div class="facts">' +
    fact("Inception", shortDate(INCEPTION_DATE)) +
    fact("Track record", s.years.toFixed(2) + " yrs") +
    fact("Fills", String(TRADES.length)) +
    fact("External cash events", "1") +
    fact("Open positions", String(ps.length)) +
    fact("Down positions", String(s.losers)) +
    fact("CAGR", pct(s.cagrPct, 1)) +
    fact("Growth", s.growth.toFixed(2) + "x") + "</div>";
  h += '<div class="note">Positions, cost basis, realised P&amp;L and cash are replayed from the ' +
    TRADES.length + "-row ledger on every render using average-cost accounting. No total is stored " +
    "anywhere, so no two figures in the app can disagree. The ledger is the account’s own " +
    "transaction record, shipped with the app; prices are the only external input and come from " +
    "the live quote feed.</div>";

  h += section("Data source") + hr();
  h += '<div class="note" style="padding-top:12px">Safari blocks a direct call to the quote API, ' +
    "so requests go through a relay. Point this at your own and nothing leaves your control; " +
    'leave it blank to use the public fallbacks. Use <span class="mono">{url}</span> as the ' +
    "placeholder, or end with a trailing <span class=\"mono\">?url=</span> style parameter.</div>";
  h += '<div class="setrow"><label>Relay endpoint</label>' +
    '<input id="relayInput" type="url" inputmode="url" autocapitalize="off" autocorrect="off" ' +
    'spellcheck="false" placeholder="https://my-relay.example.com/?url={url}" value="' +
    esc(store.get("aiap.relay", "")) + '"></div>';
  h += '<div class="btnrow"><button class="btn" id="relayClear">Clear</button>' +
    '<button class="btn primary" id="relaySave">Save &amp; refresh</button></div>';
  h += '<div class="note" style="padding-bottom:16px">Status: ' +
    (state.feed.live ? "live on all " + SYMBOLS.length + " symbols."
                     : state.feed.stale.size === SYMBOLS.length
                       ? "no relay reachable — showing snapshot marks from " + SNAPSHOT_AS_OF.slice(0, 10) + "."
                       : state.feed.stale.size + " of " + SYMBOLS.length + " symbols on snapshot marks.") +
    "</div>";

  return h;
}

  const inst = INSTRUMENTS[sym] || { name: sym, ex: "", sector: "", thesis: "" };
  const pc = tone(p.unrealized), dc = tone(p.dayChange);

  let h = '<div id="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.5" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Portfolio</div>';

  h += '<div class="dhead"><div class="sym">' + p.sym + "</div>" +
    '<div class="nm">' + esc(inst.name) + "</div>" +
    '<div class="venue">' + esc(inst.ex) + " · USD · " + esc(inst.sector) + "</div>" +
    '<div class="last ' + dc + '">' + px(p.price) + "</div>" +
    '<div class="dl ' + dc + '">' + sMoney(p.dayChange) + " (" + sPct(p.dayChangePct) + ") today</div></div>";

  h += '<div class="box"><div class="fl" style="font-size:10px;font-weight:700;letter-spacing:.4px;' +
    'text-transform:uppercase;color:var(--text-3);margin-bottom:4px">Thesis</div>' +
    esc(inst.thesis) + "</div>";

  const row = (l, v, cls) => '<div class="drow"><span class="l">' + esc(l) +
    '</span><span class="v ' + (cls || "") + '">' + v + "</span></div>" + hr(true);

  h += section("Position") + hr() +
    row("Quantity", qty(p.qty)) +
    row("Average cost", px(p.avg)) +
    row("Cost basis", money(p.cost)) +
    row("Last price", px(p.price)) +
    row("Market value", money(p.marketValue)) +
    row("Unrealised P&L", sMoney(p.unrealized), pc) +
    row("Unrealised return", sPct(p.unrealizedPct), pc) +
    row("Realised P&L", sMoney(p.realized), tone(p.realized)) +
    row("Portfolio weight", pct(p.weight * 100, 2)) +
    row("First bought", shortDate(p.firstBuy));

  h += section("Check") + hr() + '<div class="proof">' +
    qty(p.qty) + " &times; " + px(p.price) + " = " + money(p.marketValue) + "<br>" +
    money(p.marketValue) + " &minus; " + money(p.cost) + " = " +
    '<span class="' + pc + '">' + sMoney(p.unrealized) + "</span><br>" +

  const trades = TRADES.filter(t => t.sym === sym);

  for (const t of trades) {
    h += '<div class="act"><div class="l"><div class="top">' +
      '<span class="side" style="color:' + (t.side === "BUY" ? "var(--gain)" : "var(--accent)") + '">' +
      t.side + '</span><span class="dt">' + shortDate(t.date) + "</span></div>" +
      '<div class="why">' + esc(t.note) + "</div></div>" +
      '<div class="r"><div class="ca" style="font-size:12px;color:var(--text)">' +
      qty(t.qty) + " @ " + px(t.px) + "</div>" +
      '<div class="ca">' + money(t.qty * t.px) + "</div></div></div>" + hr(true);
  }
  return h;

];

function renderTabs() {
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    '<div class="tab' + (t.key === state.tab && !state.detail ? " on" : "") + '" data-tab="' + t.key + '">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + t.icon + "</svg>" +
    '<span class="lab">' + t.label + "</span></div>").join("");

function renderStrip() {
  const live = state.feed.live, n = state.feed.stale.size;
  const pill = document.getElementById("stripPill");
  pill.className = "pill " + (live ? "live" : "snap");
  pill.textContent = live ? "Live" : "Snapshot";
  document.getElementById("stripMsg").textContent =
    live ? "Real-time marks"
         : n > 0 ? n + " symbol" + (n === 1 ? "" : "s") + " on last close"
                 : "Last close";
  document.getElementById("stripClock").textContent = clockTime(state.lastUpdated);
  document.getElementById("stripIcon").style.opacity = state.refreshing ? "0.35" : "1";
}

function render() {
  const tab = TABS.find(t => t.key === state.tab);
  document.getElementById("acctSub").textContent = state.detail ? "POSITION DETAIL" : tab.sub;
  document.getElementById("acctId").textContent = ACCOUNT.id;

  let html;
  try {
    html = state.detail ? viewDetail(state.detail)
         : state.tab === "portfolio" ? viewPortfolio()
         : state.tab === "watchlist" ? viewWatchlist()
         : state.tab === "activity"  ? viewActivity()
         : viewAudit();
  } catch (e) {
    html = '<div class="note" style="padding-top:24px">Could not render: ' + esc(e.message) + "</div>";
  }
  sheet.innerHTML = html;
  renderStrip();
  renderTabs();
}

/* ----------------------------------------------------------------- events */
document.getElementById("tabs").addEventListener("click", e => {
  const el = e.target.closest("[data-tab]");
  if (!el) return;
  state.detail = null;
  state.tab = el.getAttribute("data-tab");
  document.getElementById("scroller").scrollTop = 0;
  render();
});

sheet.addEventListener("click", e => {
  if (e.target.closest("#back")) {
    state.detail = null;
    render();
    return;
  }
  if (e.target.closest("#relaySave")) {
    const v = document.getElementById("relayInput").value.trim();
    store.set("aiap.relay", v);
    workingRelay = -1;
    store.set("aiap.relayIndex", "-1");
    refresh();
    return;
  }
  if (e.target.closest("#relayClear")) {
    store.set("aiap.relay", "");
    document.getElementById("relayInput").value = "";
    workingRelay = -1;
    store.set("aiap.relayIndex", "-1");
    refresh();
    return;
  }
  const row = e.target.closest("[data-sym]");
  if (row) {
    state.detail = row.getAttribute("data-sym");
    document.getElementById("scroller").scrollTop = 0;
    render();
  }
});

document.getElementById("strip").addEventListener("click", refresh);

/* --------------------------------------------------------- pull to refresh */
/* In standalone mode there is no browser chrome to pull against, so the
   gesture has to be built. */
(function () {
  const scroller = document.getElementById("scroller");
  const pull = document.getElementById("pull");
  const THRESHOLD = 64;
  let startY = 0, pulling = false, dist = 0;

  scroller.addEventListener("touchstart", e => {
    if (scroller.scrollTop <= 0 && e.touches.length === 1) {
      startY = e.touches[0].clientY;
      pulling = true;
      dist = 0;
      pull.style.transition = "none";
    }
  }, { passive: true });

  scroller.addEventListener("touchmove", e => {
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0) { pull.style.height = "0px"; return; }
    const h = Math.min(dist * 0.5, 90);          // resistance
    pull.style.height = h + "px";
    pull.textContent = h >= THRESHOLD ? "Release to refresh" : "Pull to refresh";
    pull.className = h >= THRESHOLD ? "armed" : "";
  }, { passive: true });

  scroller.addEventListener("touchend", () => {
    if (!pulling) return;
    pulling = false;
    const h = parseFloat(pull.style.height) || 0;
    pull.style.transition = "height 0.18s ease";
    if (h >= THRESHOLD) {
      pull.style.height = "34px";
      pull.textContent = "Refreshing…";
      pull.className = "";
      refresh().then(() => { pull.style.height = "0px"; });
    } else {
      pull.style.height = "0px";
    }
  }, { passive: true });
})();

/* ---------------------------------------------------------------- refresh */
let inFlight = false;

async function refresh() {
  if (inFlight) return;
  inFlight = true;
  state.refreshing = true;
  renderStrip();
  try {
    const feed = await fetchQuotes();
    state.feed = feed;
    state.lastUpdated = new Date();
    state.curve = buildModelledCurve(feed.quotes, Date.now());
  } catch (e) {
    /* keep the previous marks; the strip already shows staleness */
  } finally {
    inFlight = false;
    state.refreshing = false;
    render();
  }
}

setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

/* The chart's viewBox is sized to the viewport, so a rotation needs a repaint. */
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

/* -------------------------------------------------- home screen icon ----- */
/* iOS reads the icon from the DOM when Add to Home Screen is tapped, so
   generating it here is enough — it keeps the file to a single document with
   no binary blob pasted into it. */
(function () {
  try {
    const S = 180, c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, S, S);

    const pts = [[18,140],[46,128],[74,112],[102,74],[130,52],[162,26]];
    const grad = g.createLinearGradient(0, 40, 0, 150);
    grad.addColorStop(0, "rgba(0,194,110,0.34)");
    grad.addColorStop(1, "rgba(0,194,110,0)");
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) g.lineTo(p[0], p[1]);
    g.lineTo(162, 150); g.lineTo(18, 150); g.closePath();
    g.fillStyle = grad; g.fill();

    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (const p of pts) g.lineTo(p[0], p[1]);
    g.strokeStyle = "#00c26e"; g.lineWidth = 9;
    g.lineJoin = "round"; g.lineCap = "round"; g.stroke();

    g.fillStyle = "#f2f4f7";
    g.font = "700 34px -apple-system, Helvetica, sans-serif";
    g.textBaseline = "alphabetic";
    g.fillText("AI", 18, 44);

    const link = document.createElement("link");
    link.rel = "apple-touch-icon";
    link.href = c.toDataURL("image/png");
    document.head.appendChild(link);
  } catch (e) { /* icon is cosmetic */ }
})();

/* Suppress the double-tap-to-zoom delay without blocking normal taps. */
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });

/**
 * The engine, exposed so the numbers can be checked from outside the UI —
 * from Safari's console, or by the parity script that asserts this build
 * agrees with the React Native one. Everything here is a pure function of the
 * ledger and a quote map.
 *
 *   AIAP.checkInvariants(AIAP.portfolio())      // the identities, live
 *   AIAP.portfolio().summary.totalReturnPct     // the headline number
 */
window.AIAP = {
  TRADES, INSTRUMENTS, SNAPSHOT, SNAPSHOT_AS_OF, SYMBOLS,
  INITIAL_CAPITAL, INCEPTION_DATE, RETURN_BAND,
  replayLedger, buildPortfolio, checkInvariants,
  buildModelledCurve, monthEnds, holdingsAsOf,
  snapshotQuotes, fetchQuotes,
  portfolio, state
};

render();
refresh();
</script>
</body>
</html>
